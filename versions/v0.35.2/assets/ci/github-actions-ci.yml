# schematize-engineering — workflow de CI de referência (§13, §21, §35; testes/Q.A. na skill schematize-qa).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack.
#
# PISO 27 — CI remoto NÃO roda por commit (custo). O gate por commit é LOCAL (tools/ci.sh e equivalentes).
# Este workflow roda só: (a) uma vez antes de promover para hml (tag `hml-*`), (b) em release (tag `v*`),
# (c) quando o usuário pedir (workflow_dispatch). VETADO `pull_request`/`pull_request_target` (qualquer filtro),
# `push` em branch, `workflow_run`, `merge_group`, cron sem justificativa. Não existe "check obrigatório no PR".
# Gate: scripts/check-ci-triggers.sh reprova o que fugir disso. Gate por commit: assets/ci/ci.sh (local).
name: ci
on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]
    paths-ignore: ["**.md", "docs/**", "*_archive/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Gate de padrões (DoD/§37) no diff
        # tag de promoção: diff desde a tag anterior (sem tag anterior: contra origin/main). Nada de github.base_ref (não há PR).
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo origin/main)"
          bash .claude/skills/schematize-engineering/scripts/check-diff.sh "$PREV"
      - name: Índice de microfunções atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './internal' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-engineering/scripts/check-index.sh
      - name: Scan de segredo no archive (§16.1/§32)
        run: bash .claude/skills/schematize-engineering/scripts/archive-secret-scan.sh .
      - name: Efeito externo não escapa de não-produção (§37, "Disparar efeito externo REAL a partir de não-produção")
        env:
          TEST_MAIL_DOMAIN: test.<domain>   # ajuste; o gate confere o null MX por dig
        run: bash .claude/skills/schematize-engineering/scripts/check-external-effects.sh .
      - name: Deploy só do git (pisos 22/23) — sem scp/rsync/tar|ssh
        env:
          SKIP_GIT: "1"   # no CI o checkout é destacado; HEAD==origin vale local/overdev
        run: bash .claude/skills/schematize-engineering/scripts/check-deploy-git.sh .
      - name: Ritmo de registro (piso 26) — OPCIONAL; só vale em sessão ativa, ative com a variável RITMO_ARCHIVE
        if: ${{ vars.RITMO_ARCHIVE != '' }}
        run: bash .claude/skills/schematize-engineering/scripts/check-ritmo.sh "${{ vars.RITMO_ARCHIVE }}"
      - name: Gatilhos de CI (piso 27) — nada de on:push em branch / pull_request sem filtro / sem concurrency
        run: bash .claude/skills/schematize-engineering/scripts/check-ci-triggers.sh .
      - name: Resiliência do microserviço (piso 28) — OPCIONAL; ative com a variável RESILIENCE_DIRS (dirs de serviço com resilience.yml, separados por espaço)
        if: ${{ vars.RESILIENCE_DIRS != '' }}
        run: |
          for d in ${{ vars.RESILIENCE_DIRS }}; do
            bash .claude/skills/schematize-engineering/scripts/check-resilience.sh "$d"
          done

  test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: "Smoke + security + authz + hardening (testes/Q.A.: schematize-qa)"
        run: |
          # LIGUE ao CLI do projeto. Enquanto o placeholder existir o passo REPROVA (verde de mentira é vetado).
          echo "ERRO: ligue o test kit do <projeto>_ops (smoke/security/authz/hardening) antes de usar este template" >&2
          exit 1
          # <projeto> test smoke && <projeto> test security && <projeto> test authz && <projeto> test hardening
      - name: Smoke self-check (anti verde-mentiroso — schematize-qa)
        run: bash .claude/skills/schematize-qa/scripts/smoke-selfcheck.sh --self-check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: '1' }
      - name: Gitleaks   # em repo de ORGANIZAÇÃO exige GITLEAKS_LICENSE (secret); sem licença, troque por `gitleaks detect` via binário
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
